openapi: 3.1.0
info:
  title: BareBonesEshop External API
  version: 1.0.0
  description: |
    Stable machine-to-machine API. Amounts are integer minor units. New fields may
    be added, but existing v1 fields keep their meaning. Browser sessions and CSRF
    are not authentication mechanisms for this API.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /products:
    get:
      operationId: listProducts
      summary: List products in stable ID order
      x-required-scope: products:read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UpdatedAfter'
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createProduct
      summary: Idempotently create a simple product
      description: |
        The product is created as the CSV import creates it: the slug is derived from the name unless given (and
        made unique), the price is recorded in the price history and stock is booked in the default warehouse
        ledger. Without category_id the product goes to the "uncategorized" category. Subscribers receive the
        new product as a product.updated event (there is no separate product.created event).
      x-required-scope: products:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201':
          description: Created product; an identical retry returns the stored response with idempotent_replay=true and creates nothing
          headers:
            ETag:
              description: Version of the new product
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Product' }
                  meta: { $ref: '#/components/schemas/WriteMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: The Idempotency-Key was already used for a different request (idempotency_conflict), or a product or variant already uses the SKU (sku_exists; nothing is stored, update it with PATCH /products/{id})
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: category_id is not a category of the credential store catalog (unknown_category); nothing is stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getProduct
      summary: Get one product
      x-required-scope: products:read
      responses:
        '200':
          description: Product
          headers:
            ETag:
              description: Version of the product; send it as If-Match on PATCH to avoid overwriting a concurrent change
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      operationId: updateProduct
      summary: Idempotently update explicitly supported product fields
      x-required-scope: products:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: false
          description: ETag from GET /products/{id}; when the product changed since, nothing is stored and the answer is 412
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatch'
      responses:
        '200':
          description: Updated product; an identical retry, also one sent concurrently, returns the stored response with idempotent_replay=true and the change is applied once
          headers:
            ETag:
              description: Version of the product after the change
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Product' }
                  meta:
                    type: object
                    required: [idempotent_replay]
                    properties:
                      idempotent_replay: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: The Idempotency-Key was already used for a different request (idempotency_conflict), or the stock change would break existing warehouse reservations (stock_conflict, nothing is stored and the key can be retried)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: If-Match does not match the current product (precondition_failed); nothing is stored, read the product again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders:
    get:
      operationId: listOrders
      summary: List orders owned by the credential store, with their lines and address
      x-required-scope: orders:read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UpdatedAfter'
      responses:
        '200':
          description: Order page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getOrder
      summary: Get one order owned by the credential store
      x-required-scope: orders:read
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: changeOrderStatus
      summary: Idempotently move an order through the order workflow (stock, events, audit and e-mails as in the admin)
      description: "A move to paid requires a confirmed payment; a move to refunded additionally requires the refunds:write scope."
      x-required-scope: orders:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderStatusChange' }
      responses:
        '200':
          description: Changed order; an identical retry returns the stored response with idempotent_replay=true and the change is applied once
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Order' }
                  meta: { $ref: '#/components/schemas/WriteMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The Idempotency-Key was already used for a different request (idempotency_conflict), or the workflow refused the change while applying it, e.g. backordered items on shipped (order_conflict, nothing is stored and the key can be retried)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: The transition is not allowed from the current status (invalid_transition) or the payment is not confirmed (payment_not_confirmed); error.allowed lists the allowed next statuses. Stored under the Idempotency-Key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /orders/{id}/shipments:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listOrderShipments
      summary: Shipments of an order with carrier, tracking number and items
      x-required-scope: orders:read
      responses:
        '200':
          description: Shipments in creation order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Shipment' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /categories:
    get:
      operationId: listCategories
      summary: List categories of the credential store catalog in stable ID order
      x-required-scope: categories:read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Category page
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Category' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getCategory
      summary: Get one category of the credential store catalog
      x-required-scope: categories:read
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /customers:
    get:
      operationId: listCustomers
      summary: List customer accounts of the credential store (no password hashes or tokens)
      x-required-scope: customers:read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UpdatedAfter'
      responses:
        '200':
          description: Customer page
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Customer' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getCustomer
      summary: Get one customer account of the credential store
      x-required-scope: customers:read
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /inventory:
    get:
      operationId: getInventory
      summary: Stock of one product or variant SKU per warehouse
      x-required-scope: inventory:read
      parameters:
        - name: sku
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 191 }
      responses:
        '200':
          description: Inventory of the SKU
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Inventory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /inventory/adjustments:
    post:
      operationId: adjustInventory
      summary: Idempotently change the on-hand quantity of a SKU in one warehouse, booked in the stock ledger
      x-required-scope: inventory:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryAdjustment' }
      responses:
        '200':
          description: Inventory after the change; an identical retry returns the stored response with idempotent_replay=true and books nothing
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Inventory' }
                  meta: { $ref: '#/components/schemas/WriteMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The Idempotency-Key was already used for a different request (idempotency_conflict), or the change would go below reserved stock (stock_conflict, nothing is stored and the key can be retried)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
webhooks:
  commerceEvent:
    post:
      security: []
      summary: Signed retry-safe commerce event delivery
      description: |
        The body is a CloudEvents-compatible v1 envelope. Verify
        `X-BBE-Signature` as `v1=hex(HMAC-SHA256(secret,
        timestamp + "." + event_id + "." + raw_body))`, reject timestamps more
        than 300 seconds from local time, and persist `X-BBE-Event-ID` after a
        successful transaction to prevent replay. Return any 2xx status only after
        committing. Non-2xx/network failures are retried with exponential backoff
        (5 seconds doubling up to 6 hours) for about three days; after 25 attempts
        the event enters the dead-letter state, and `php cli/outbox-requeue.php`
        queues it again. Retries keep the same event ID and payload but use a fresh
        timestamp/signature. Order events of one subject by `sequence`.
      parameters:
        - name: X-BBE-Event-ID
          in: header
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - name: X-BBE-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^\d{10}$' }
        - name: X-BBE-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^v1=[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema: { $ref: '#/components/schemas/EventEnvelope' }
      responses:
        '204': { description: Event committed and event ID persisted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: BBE API token
      description: Tokens are shown once; only their SHA-256 hashes are stored.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as meta.next_cursor; clients must not decode it.
      schema: { type: string, maxLength: 64 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    UpdatedAfter:
      name: updated_after
      in: query
      required: false
      description: |
        Only rows whose updated_at is at or after this UTC time ("2026-11-04 10:00:00", "2026-11-04" or ISO 8601
        with Z or an offset). For an incremental sync, page through with the cursor and keep meta.server_time of
        the FIRST page's meta.next_updated_after; pass it as updated_after on the next run. It is server_time less
        five minutes, since a change committed by a transaction that began before server_time carries an earlier
        updated_at; rows seen twice are harmless because they are identified by id. A stock change (a sale, a
        shipment, an adjustment) moves the product's updated_at. Not accepted on lists without updated_at (400).
      schema: { type: string, maxLength: 40 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique 8-191 character key. Reusing it with a different request returns 409.
      schema: { type: string, minLength: 8, maxLength: 191 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid, inactive or expired bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Credential lacks the required scope or store permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource is absent from the credential store
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: More than 300 requests per minute from one client address (rate_limited); retry later
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { type: integer, minimum: 0, description: Integer minor units (cents where applicable). }
        currency: { type: string, pattern: '^[a-z]{3}$' }
    Product:
      type: object
      additionalProperties: false
      required: [id, sku, slug, name, type, price, compare_price, stock, status, weight_g, created_at, updated_at]
      properties:
        id: { type: integer }
        sku: { type: string }
        slug: { type: string }
        name: { type: string }
        type: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        compare_price: { type: [integer, 'null'], minimum: 0 }
        stock: { type: integer, minimum: 0 }
        status: { type: string, enum: [active, draft, archived] }
        weight_g: { type: integer, minimum: 0 }
        created_at: { type: string }
        updated_at: { type: string }
    ProductPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 191 }
        status: { type: string, enum: [active, draft, archived] }
        price: { type: integer, minimum: 0, maximum: 2000000000 }
        compare_price: { type: [integer, 'null'], minimum: 0, maximum: 2000000000 }
        stock: { type: integer, minimum: 0, maximum: 2000000000, description: Available quantity; the difference is booked as an api_adjustment in the default warehouse ledger. }
        weight_g: { type: integer, minimum: 0, maximum: 2000000000 }
    ProductCreate:
      type: object
      additionalProperties: false
      required: [sku, name, price]
      properties:
        sku: { type: string, minLength: 1, maxLength: 191, description: Unique across products and variants of every catalog. }
        name: { type: string, minLength: 1, maxLength: 191 }
        price: { type: integer, minimum: 0, maximum: 2000000000 }
        compare_price: { type: [integer, 'null'], minimum: 0, maximum: 2000000000 }
        stock: { type: integer, minimum: 0, maximum: 2000000000, default: 0, description: 'Available quantity, booked in the default warehouse ledger.' }
        status: { type: string, enum: [active, draft, archived], default: draft }
        weight_g: { type: integer, minimum: 0, maximum: 2000000000, default: 0 }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 191, description: 'Derived from the name when omitted; a slug taken by another product gets a -2, -3… suffix.' }
        category_id: { type: integer, minimum: 1 }
    Address:
      type: object
      required: [company, street, city, zip, country, ico, dic, ic_dph]
      properties:
        company: { type: [string, 'null'] }
        street: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        zip: { type: [string, 'null'] }
        country: { type: [string, 'null'], description: 'ISO 3166-1 alpha-2, upper case.' }
        ico: { type: [string, 'null'], description: Company registration number (IČO). }
        dic: { type: [string, 'null'], description: Tax number (DIČ). }
        ic_dph: { type: [string, 'null'], description: VAT ID (IČ DPH). }
    OrderItem:
      type: object
      required: [id, product_id, variant_id, sku, name, quantity, unit_price, total, discount, vat_rate, vat_amount]
      properties:
        id: { type: integer }
        product_id: { type: [integer, 'null'] }
        variant_id: { type: [integer, 'null'] }
        sku: { type: string }
        name: { type: string, description: Product name at the time of the order. }
        quantity: { type: integer, minimum: 1 }
        unit_price: { type: integer, description: Gross unit price in minor units. }
        total: { type: integer, description: Gross line total in minor units before the order discount. }
        discount: { type: integer, minimum: 0, description: The share of the order discount on this line (minor units). }
        vat_rate: { type: [number, 'null'], description: VAT rate in percent. }
        vat_amount: { type: integer, description: 'VAT of the line after its discount, as on the order and its invoice.' }
    Order:
      type: object
      additionalProperties: false
      required: [id, number, status, payment_status, customer, totals, created_at, updated_at, locale, shipping, payment_method, items]
      description: Webhook events carry the fields up to updated_at; the API adds the shipping, payment and lines, and for a key granted customers:read the personal data (customer.phone, address, notes). Shipped quantities are in GET /orders/{id}/shipments.
      properties:
        id: { type: integer }
        number: { type: string }
        status: { type: string }
        payment_status: { type: string }
        customer:
          type: object
          required: [id, name, email]
          properties:
            id: { type: [integer, 'null'] }
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: [string, 'null'], description: 'Only in API responses to a key granted customers:read (personal data); never in webhook events.' }
        locale: { type: [string, 'null'] }
        address: { $ref: '#/components/schemas/Address', description: Only for a key granted customers:read. }
        shipping:
          type: object
          required: [method, pickup_point]
          properties:
            method: { type: [string, 'null'] }
            pickup_point:
              type: [object, 'null']
              properties:
                id: { type: [string, 'null'] }
                name: { type: [string, 'null'] }
                address: { type: [string, 'null'] }
        payment_method: { type: [string, 'null'] }
        notes: { type: [string, 'null'], description: "The customer's note to the order; only for a key granted customers:read." }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        totals:
          type: object
          required: [subtotal, discount, shipping, tax, total, currency]
          properties:
            subtotal: { type: integer }
            discount: { type: integer }
            shipping: { type: integer }
            tax: { type: integer }
            total: { type: integer }
            currency: { type: string, pattern: '^[a-z]{3}$' }
        created_at: { type: string }
        updated_at: { type: string }
    OrderStatusChange:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [pending, paid, processing, shipped, delivered, returned, cancelled, refunded] }
        note: { type: [string, 'null'], maxLength: 500 }
        acknowledge_withdrawal: { type: boolean, default: false, description: 'Ship although the consumer withdrew from the order (otherwise 422 withdrawn)' }
    Shipment:
      type: object
      required: [id, status, warehouse_id, carrier, tracking_number, tracking_url, shipped_at, created_at, items]
      properties:
        id: { type: integer }
        status: { type: string, enum: [planned, shipping, shipped, cancelled] }
        warehouse_id: { type: [integer, 'null'] }
        carrier: { type: [string, 'null'] }
        tracking_number: { type: [string, 'null'] }
        tracking_url: { type: [string, 'null'], format: uri }
        shipped_at: { type: [string, 'null'] }
        created_at: { type: string }
        items:
          type: array
          items:
            type: object
            required: [order_item_id, sku, quantity, status]
            properties:
              order_item_id: { type: integer }
              sku: { type: string }
              quantity: { type: integer }
              status: { type: string }
    Category:
      type: object
      required: [id, parent_id, slug, name, path, depth, sort_order]
      properties:
        id: { type: integer }
        parent_id: { type: [integer, 'null'] }
        slug: { type: string }
        name: { type: string }
        path: { type: string }
        depth: { type: integer, minimum: 0 }
        sort_order: { type: integer }
    Customer:
      type: object
      required: [id, email, name, phone, locale, status, email_verified_at, last_login_at, created_at, updated_at]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        phone: { type: [string, 'null'] }
        locale: { type: [string, 'null'] }
        status: { type: string }
        email_verified_at: { type: [string, 'null'] }
        last_login_at: { type: [string, 'null'] }
        created_at: { type: string }
        updated_at: { type: string }
    Inventory:
      type: object
      required: [sku, available, warehouses]
      properties:
        sku: { type: string }
        available: { type: integer, minimum: 0, description: Sum of on-hand minus reserved over all warehouses of the store. }
        warehouses:
          type: array
          items:
            type: object
            required: [code, name, qty, reserved, available]
            properties:
              code: { type: string }
              name: { type: string }
              qty: { type: integer }
              reserved: { type: integer }
              available: { type: integer, minimum: 0 }
    InventoryAdjustment:
      type: object
      additionalProperties: false
      required: [sku, delta]
      properties:
        sku: { type: string, minLength: 1, maxLength: 191 }
        delta: { type: integer, not: { const: 0 }, minimum: -1000000, maximum: 1000000, description: Change of the on-hand quantity. }
        warehouse: { type: string, maxLength: 64, description: Warehouse code; the default warehouse when omitted. }
        reason: { type: [string, 'null'], maxLength: 191 }
    WriteMeta:
      type: object
      required: [idempotent_replay]
      properties:
        idempotent_replay: { type: boolean }
    PageMeta:
      type: object
      required: [limit, next_cursor]
      properties:
        limit: { type: integer }
        next_cursor: { type: [string, 'null'] }
        server_time: { type: string, description: 'Database UTC time ("Y-m-d H:i:s") read before the page; only on lists that take updated_after.' }
        next_updated_after: { type: string, description: 'server_time less five minutes: the updated_after of the next incremental sync (keep the one of the first page).' }
    ProductPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Product' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    OrderPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Order' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    EventEnvelope:
      type: object
      required: [specversion, id, type, source, time, datacontenttype, subject, sequence, bbeversion, store_id, channel_id, data]
      properties:
        specversion: { const: '1.0' }
        id: { type: string, pattern: '^[a-f0-9]{32}$' }
        type: { type: string }
        source: { type: string }
        time: { type: string, format: date-time }
        datacontenttype: { const: application/json }
        subject: { type: string }
        sequence:
          type: integer
          minimum: 0
          description: Grows with every recorded event. Deliveries can arrive out of order (retries); for the same subject the event with the higher sequence is the later change, so ignore one older than the last applied. 0 marks events recorded before sequences existed.
        bbeversion: { type: integer, minimum: 1 }
        store_id: { type: string }
        channel_id: { type: string }
        data: { type: object }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
