# BareBones Shop — sample stack: nginx + PHP-FPM + queue worker, SQLite on a volume.
#
#   docker compose -f deploy/docker-compose.yml run --rm --user www-data -e BBE_ADMIN_PASSWORD=... php \
#     php cli/setup.php install --app-url=http://localhost:8080 --admin-username=admin
#   docker compose -f deploy/docker-compose.yml up -d
#
# The checkout (with the vendor/bbf submodule) is mounted as the document root; config.php
# and private runtime data (../bareboneseshop-private in config.example.php) never live in
# the image. PHP runs as www-data (uid 33), which must be able to write config.php (once),
# cache/ and import/ in the checkout. For MySQL add a database service and set
# db_driver/db_* in config.php.
name: bareboneseshop

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/var/www/html
      - private:/var/www/bareboneseshop-private
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    user: www-data
    command: ["sh", "-c", "while true; do php cli/worker.php; sleep 60; done"]
    volumes:
      - ..:/var/www/html
      - private:/var/www/bareboneseshop-private
    depends_on: [php]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
    restart: unless-stopped

volumes:
  private:
