# BareBones Shop — sample stack: nginx + PHP-FPM + queue worker, SQLite on a volume.
#
#   docker compose -f deploy/docker-compose.yml run --rm -e BBE_ADMIN_PASSWORD=... setup \
#     php cli/setup.php install --app-url=http://localhost:8080 --admin-username=admin
#   docker compose -f deploy/docker-compose.yml up -d
#
# The checkout (with the vendor/bbf submodule) is mounted as the document root; config.php
# and private runtime data (../bareboneseshop-private in config.example.php) never live in
# the image. PHP runs as www-data (uid 33) on a read-only root filesystem with the
# application code mounted read-only: only cache/, uploads/, import/ and logs/ of the
# checkout are writable; the opt-in `setup` service creates them for uid 33 and is the only
# one that can write config.php. For MySQL add a database service and set db_driver/db_* in
# config.php.
name: bareboneseshop

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ..:/var/www/html:ro
      - ../cache:/var/www/html/cache
      - ../uploads:/var/www/html/uploads
      - ../import:/var/www/html/import
      - ../logs:/var/www/html/logs
      - private:/var/www/bareboneseshop-private
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    # GDPR retention GC (cli/gdpr-gc.php --apply, pre-retention snapshot first) runs once a day; one attempt per day.
    command: ["sh", "-c", "gc=''; while true; do php cli/worker.php; d=$$(date -u +%F); if [ \"$$d\" != \"$$gc\" ]; then php cli/gdpr-gc.php --apply --quiet; gc=$$d; fi; sleep 60; done"]
    volumes:
      - ..:/var/www/html:ro
      - ../cache:/var/www/html/cache
      - ../uploads:/var/www/html/uploads
      - ../import:/var/www/html/import
      - ../logs:/var/www/html/logs
      - private:/var/www/bareboneseshop-private
    # Ready = database reachable, stores.json valid, jobs_dir and private_cache_dir writable.
    healthcheck:
      test: ["CMD", "php", "-r", "require 'src/autoload.php'; exit(Health::readiness()['status'] === 'ready' ? 0 : 1);"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped

  # One-off installer: `docker compose run --rm setup php cli/setup.php ...`. It runs as root only to
  # create config.php in the host-owned checkout; deploy/docker-setup.sh then gives cache/, uploads/,
  # import/, logs/ and the private volume to www-data and config.php to the www-data group.
  setup:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [setup]
    user: "0:0"
    entrypoint: ["sh", "/var/www/html/deploy/docker-setup.sh"]
    volumes:
      - ..:/var/www/html
      - private:/var/www/bareboneseshop-private

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Through nginx and PHP-FPM: a broken FastCGI hop makes the container unhealthy.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped

volumes:
  private:
