# BareBones Shop — sample nginx server block (PHP-FPM).
# Mirrors the deny and rewrite rules of the bundled .htaccess; keep both in sync.
# Private runtime data (database, jobs, backups, invoices, logs) lives outside the
# document root, in the paths of config.example.php (../bareboneseshop-private).

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    autoindex off;
    client_max_body_size 20m;

    # Private/runtime/source trees, also in any letter case.
    location ~* ^/(?:storage|db|jobs|logs|config|cli|src|migrations|adapters|extensions|lang|demo|docs|forms|blocks|data|templates|releases|tests|deploy|cache|node_modules|test-results|playwright-report|parity-report)(?:/|$) { return 403; }
    location ~* ^/themes/[^/]+/(?:theme\.json|blocks(?:/|$)) { return 403; }
    location ~* ^/import/(?!test-products\.csv$) { return 403; }

    # ACME validation and security.txt stay public; every other dotfile is denied.
    location ~ ^/\.well-known/(?:acme-challenge/[A-Za-z0-9_-]+|security\.txt)$ { try_files $uri =404; }
    location ~ (?:^|/)\. { return 403; }
    location ~* ^/(?:config(?:\.example)?\.php|router\.php|stores\.json|catalog\.json|shipping\.json|tax\.json|pricing\.json|layouts\.json|admin-roles\.json|models\.yaml|composer\.(?:json|lock)|package(?:-lock)?\.json)$ { return 403; }
    location ~* \.(?:(?:sqlite3?|db)(?:-(?:wal|shm))?|wal|shm|sql|dump|bak|backup|log|lock|tmp|ini|ya?ml|pem|key|md|neon(?:\.dist)?)$ { return 403; }

    # Files nginx serves itself get the security headers PHP sends on its responses (Security::headers()).
    # add_header is not inherited into a location that has its own, so each file-serving location repeats
    # them; the PHP location adds none (its responses would carry a second CSP).

    # Uploaded content is never executed, and is sandboxed: an SVG opened directly cannot run script on
    # the shop origin. ^~ skips the server-level regex locations, so their denies are repeated in here:
    # PHP-like names, dotfiles and data files (.env, .sql, .sqlite …) are refused under /uploads/ too.
    location ^~ /uploads/ {
        location ~* \.(?:php(?:[0-9]+|s)?|phtml?|phar)(?:[./]|$) { return 403; }
        location ~ (?:^|/)\. { return 403; }
        location ~* \.(?:(?:sqlite3?|db)(?:-(?:wal|shm))?|wal|shm|sql|dump|bak|backup|log|lock|tmp|ini|ya?ml|pem|key|md|neon(?:\.dist)?)$ { return 403; }
        try_files $uri @redirect;
        expires 1y;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # vendor/: only BBF's browser assets. The shop embeds BBF (admin forms render and save
    # through admin.php); BBF's own submit.php would serve its bundled demo forms.
    location ~* ^/vendor/bbf/bbf\.(?:css|js)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
    location ~* ^/vendor/ { return 403; }

    # SEO-friendly URLs (store prefixes /cs, /de ... are resolved by redirect.php).
    rewrite ^/sitemap\.xml$ /sitemap.php last;
    rewrite ^/sitemap-([0-9]+)\.xml$ /sitemap.php?part=$1 last;
    rewrite ^/robots\.txt$ /robots.php last;
    rewrite ^/feeds/google\.xml$ /feed.php?channel=google last;
    rewrite ^/feeds/meta\.csv$ /feed.php?channel=meta last;
    rewrite ^/product/([a-z0-9-]+)/?$ /product.php?slug=$1 last;
    rewrite ^/category/([a-z0-9/-]+)/?$ /index.php?category=$1 last;
    rewrite ^/page/([a-z0-9-]+)/?$ /page.php?slug=$1 last;
    rewrite ^/wishlist/?$ /wishlist.php last;
    rewrite ^/(?:healthz|readyz)$ /health.php last;
    rewrite ^/api/v1(?:/.*)?$ /api/v1/index.php last;

    location = / { rewrite ^ /index.php last; }
    location / {
        # Existing files are served; directories are never listed; the rest goes to the
        # admin-managed exact-path redirects, which answer 404 for unknown paths.
        try_files $uri @redirect;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
    location @redirect {
        rewrite ^/(.+)$ /redirect.php?path=/$1 last;
        return 404;
    }

    location ~ \.php$ {
        # Store-prefixed scripts (/cs/account.php, /cs/wishlist.php) do not exist on disk: redirect.php
        # dispatches them to the root script, which resolves the store from the request path.
        try_files $uri @redirect;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    location ~* \.(?:css|js|jpe?g|png|webp|svg)$ {
        try_files $uri @redirect;
        expires 1y;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
