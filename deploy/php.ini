; BareBones Shop — production overrides on top of php.ini-production (deploy/Dockerfile).
; Errors go to the PHP-FPM log (container stderr), never to visitors.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
; Product images, CSV imports and update packages up to nginx's client_max_body_size (deploy/nginx.conf);
; PHP's own default would refuse any upload above 2 MB.
upload_max_filesize = 20M
post_max_size = 20M
