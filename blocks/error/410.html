<div class="error-page">
    <h1>{{t.product_discontinued}}</h1>
    <p>{{product.name}}</p>
    {{#if related.length > 0}}
        <h2>{{t.related_products}}</h2>
        <div class="product-grid">
            {{#each related}}
                {{> product/product-card}}
            {{/each}}
        </div>
    {{/if}}
    <a href="/" class="btn btn--secondary">{{t.home}}</a>
</div>
