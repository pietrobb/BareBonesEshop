<div class="checkout-form">
    <h2>{{t.checkout}}</h2>
    <form method="post" action="/api.php?action=checkout" data-checkout>
        <input type="hidden" name="csrf_token" value="{{csrf_token}}">

        <fieldset>
            <legend>{{t.billing_address}}</legend>
            <div class="form-row">
                <input type="text" name="first_name" placeholder="{{t.first_name}}" required>
                <input type="text" name="last_name" placeholder="{{t.last_name}}" required>
            </div>
            <input type="email" name="email" placeholder="{{t.email}}" required>
            <input type="tel" name="phone" placeholder="{{t.phone}}">
            <input type="text" name="street" placeholder="{{t.street}}" required>
            <div class="form-row">
                <input type="text" name="city" placeholder="{{t.city}}" required>
                <input type="text" name="zip" placeholder="{{t.zip}}" required>
            </div>
            <input type="text" name="country" placeholder="{{t.country}}" required>
        </fieldset>

        <fieldset>
            <legend>{{t.shipping_method}}</legend>
            <label><input type="radio" name="shipping" value="standard" checked> {{t.standard_delivery}}</label>
            <label><input type="radio" name="shipping" value="express"> {{t.express_delivery}}</label>
            <label><input type="radio" name="shipping" value="pickup"> {{t.pickup}}</label>
        </fieldset>

        <button type="submit" class="btn btn--primary btn--full">{{t.place_order}}</button>
    </form>
</div>
