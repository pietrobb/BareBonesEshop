<div class="cart-items">
    <h2>{{t.cart}}</h2>
    {{#if cart.items}}
        <table class="cart-table">
            <thead>
                <tr>
                    <th></th>
                    <th>Product</th>
                    <th>{{t.price}}</th>
                    <th>{{t.quantity}}</th>
                    <th>{{t.total}}</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {{#each cart.items}}
                    <tr data-cart-item="{{key}}">
                        <td><img src="/uploads/thumb/{{image}}" alt="{{name}}" width="60"></td>
                        <td>
                            <a href="/product/{{slug}}">{{name}}</a>
                            {{#if variant_name}}<br><small>{{variant_name}}</small>{{/if}}
                        </td>
                        <td>{{price_formatted}}</td>
                        <td>
                            <input type="number" value="{{qty}}" min="1" max="{{stock}}"
                                   data-action="cart-update" data-key="{{key}}">
                        </td>
                        <td>{{total_formatted}}</td>
                        <td>
                            <button data-action="cart-remove" data-key="{{key}}">{{../t.remove}}</button>
                        </td>
                    </tr>
                {{/each}}
            </tbody>
        </table>
    {{else}}
        <p>{{t.cart_empty}}</p>
    {{/if}}
</div>
