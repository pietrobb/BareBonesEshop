name: Payment gateway (Stripe test mode)

# Checkout critical path, layer 3 (P0 2026-10-13): a real Stripe test-mode Checkout session
# opened by a real browser click. Runs nightly and whenever a file on the checkout critical
# path changes. Needs the repository secret STRIPE_TEST_SECRET_KEY: a test-mode key, either
# sk_test_... or a restricted rk_test_... (live keys are refused by tests/e2e/prepare.php); without it
# the job fails, because a critical-path change must not ship unproven. Exception: pull requests that
# GitHub runs without repository secrets (Dependabot, forks) skip it with a notice; the merge to main
# and the nightly run still prove the gateway path with the key.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/Security.php'
      - 'src/UrlAliases.php'
      - 'src/Updater.php'
      - 'src/CheckoutService.php'
      - 'src/CheckoutSession.php'
      - 'src/PaymentService.php'
      - 'src/Http/ApiHandlers.php'
      - 'src/Entrypoints/Storefront.php'
      - 'src/Entrypoints/Storefront/CheckoutPages.php'
      - 'index.php'
      - 'redirect.php'
      - '.htaccess'
      - 'adapters/PaymentAdapter.php'
      - 'adapters/contrib/*Payment.php'
      - 'themes/*/blocks/storefront/checkout*.html'
      - 'themes/*/assets/storefront.js'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - '.github/workflows/payment-gateway.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/Security.php'
      - 'src/UrlAliases.php'
      - 'src/Updater.php'
      - 'src/CheckoutService.php'
      - 'src/CheckoutSession.php'
      - 'src/PaymentService.php'
      - 'src/Http/ApiHandlers.php'
      - 'src/Entrypoints/Storefront.php'
      - 'src/Entrypoints/Storefront/CheckoutPages.php'
      - 'index.php'
      - 'redirect.php'
      - '.htaccess'
      - 'adapters/PaymentAdapter.php'
      - 'adapters/contrib/*Payment.php'
      - 'themes/*/blocks/storefront/checkout*.html'
      - 'themes/*/assets/storefront.js'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - '.github/workflows/payment-gateway.yml'

permissions:
  contents: read

jobs:
  stripe-test-key:
    name: Stripe test key available
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.key.outputs.run }}
    steps:
      - name: Require the Stripe test key (skip pull requests that get no secrets)
        id: key
        env:
          E2E_STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$E2E_STRIPE_TEST_SECRET_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && { [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ "$PR_FROM_FORK" = "true" ]; }; then
            echo "::notice::Stripe test-mode checkout skipped: GitHub gives this pull request (${PR_AUTHOR}) no repository secrets. It runs on main after the merge and nightly."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Repository secret STRIPE_TEST_SECRET_KEY (sk_test_... or rk_test_...) is missing; the real gateway path is unproven."
          exit 1

  stripe-test-checkout:
    name: Stripe test-mode checkout (Chromium, WebKit iPhone, Firefox)
    needs: stripe-test-key
    if: needs.stripe-test-key.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The Stripe key is passed only to the steps that need it (never to npm/npx installs, whose
    # dependency scripts could read the environment); prepare.php writes it into the runtime config.

    steps:

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, json, dom, libxml, sodium, curl
          coverage: none
          tools: none

      - name: Setup Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Playwright browsers
        timeout-minutes: 40
        run: |
          npm ci --ignore-scripts
          # The runner's apt mirror can stall for minutes per package: time out and retry instead of hanging the job.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          for attempt in 1 2 3; do
            timeout 480 npx playwright install --with-deps chromium webkit firefox && exit 0
            echo "::warning::playwright install attempt $attempt did not finish; retrying"
            # timeout stops npx, not the apt-get it started: let that finish (it holds the dpkg lock) before retrying.
            timeout 600 bash -c 'while pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null; do sleep 10; done' || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Prepare disposable SQLite application with the Stripe test key
        env:
          E2E_RUNTIME_DIR: /tmp/barebones-e2e-stripe
          E2E_STATE_PATH: /tmp/barebones-e2e-stripe-state.json
          E2E_STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          BBE_ADMIN_IDENTITY_KEY: RUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUU=
        run: |
          php tests/e2e/prepare.php
          php cli/migrate.php
          php cli/seed.php --count=30
          php tests/e2e/seed.php

      - name: Real Stripe Checkout redirect
        env:
          CI: '1'
          E2E_STATE_PATH: /tmp/barebones-e2e-stripe-state.json
          BBE_ADMIN_IDENTITY_KEY: RUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUU=
        # csp-guard.spec.js proves the CSP guard itself still catches the 1.9.0 form-action drop.
        run: npx playwright test stripe-test.spec.js csp-guard.spec.js commerce.spec.js --grep "Stripe|card checkout|online payment|double click"

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: stripe-test-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
