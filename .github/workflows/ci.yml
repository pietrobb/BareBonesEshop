name: CI

on:
  push:
    branches: [main, master, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    # RedisQueue's Lua claim/lease scripts run against a real server here (AuditRedisQueueRegression).
    services:
      redis:
        image: redis:7@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring, json, dom, libxml, sodium, gd, redis
          coverage: none
          tools: none

      # Tracked files only: each file is linted once, and the vendor/bbf submodule (its own repository) is skipped.
      - name: PHP syntax check (php -l) on all sources
        run: |
          set -e
          git ls-files -z '*.php' | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Prepare runtime directories
        run: |
          mkdir -p db cache logs jobs
          cp config.example.php config.php

      - name: Run test suite
        env:
          BAREBONES_REQUIRE_UPDATE_SIGNATURE_TEST: '1'
          BAREBONES_REQUIRE_REDIS_TEST: '1'
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: '6379'
        run: php cli/test.php

      - name: Static analysis, i18n, WCAG 2.2 AA, and performance source gates
        run: |
          php cli/static-analysis.php
          php cli/i18n-parity.php
          php cli/quality-gates.php

  phpstan:
    name: PHPStan level 5 (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PHPSTAN_VERSION: '2.3.1'
      PHPSTAN_SHA256: 85157dba3d95d77ca603d2b7303aa78a538f9e3b56ccad07dd794c53aa96d1ae

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, json, dom, libxml, sodium
          coverage: none
          tools: none

      - name: Download pinned PHPStan phar (CI only, the runtime stays dependency-free)
        run: |
          curl -fsSL -o /tmp/phpstan.phar "https://github.com/phpstan/phpstan/releases/download/${PHPSTAN_VERSION}/phpstan.phar"
          echo "${PHPSTAN_SHA256}  /tmp/phpstan.phar" | sha256sum -c -

      - name: Analyse (new findings fail; existing ones are in phpstan-baseline.neon)
        run: php -d memory_limit=2G /tmp/phpstan.phar analyse -c phpstan.neon.dist --no-progress

  docker-image:
    name: Deploy Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - name: Build deploy/Dockerfile and smoke-test the PHP runtime
        run: |
          docker build --pull -t bareboneseshop-ci deploy
          docker run --rm bareboneseshop-ci php -m | tee /tmp/php-modules.txt
          grep -qx pdo_mysql /tmp/php-modules.txt
          grep -qx gd /tmp/php-modules.txt
          docker run --rm bareboneseshop-ci php -r 'exit(ini_get("display_errors") === "" || ini_get("display_errors") === "0" ? (ini_get("expose_php") ? 1 : 0) : 1);'

      # README "Docker" from a fresh checkout owned by the runner user (not uid 33).
      - name: README Docker install, storefront and uploaded image
        run: |
          compose="docker compose -f deploy/docker-compose.yml"
          $compose run --rm -e BBE_ADMIN_PASSWORD=Ci-docker-Passw0rd-1 setup php cli/setup.php install --app-url=http://localhost:8080 --admin-username=admin
          $compose up -d --wait
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/healthz && break; sleep 2; done
          curl -fsS -o /dev/null -w 'storefront %{http_code}\n' http://localhost:8080/
          $compose exec -T php php -r 'require "src/autoload.php"; $s = new LocalStorage([]); echo $s->store("ci/probe/pixel.png", base64_decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==")), "\n";'
          curl -fsS -o /dev/null -w 'uploaded image %{http_code}\n' http://localhost:8080/uploads/ci/probe/pixel.png
          # Files nginx serves itself carry the security headers; an upload is sandboxed; a PHP page has one CSP.
          curl -fsS -D /tmp/upload-headers.txt -o /dev/null http://localhost:8080/uploads/ci/probe/pixel.png
          grep -qi '^x-content-type-options: nosniff' /tmp/upload-headers.txt
          grep -qi "^content-security-policy: default-src 'none'.*sandbox" /tmp/upload-headers.txt
          curl -fsS -D /tmp/asset-headers.txt -o /dev/null http://localhost:8080/themes/default/assets/storefront.css
          grep -qi '^x-content-type-options: nosniff' /tmp/asset-headers.txt
          test "$(curl -fsS -D - -o /dev/null http://localhost:8080/ | grep -ci '^content-security-policy:')" = 1
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/config.php)" != 200
          $compose exec -T php php cli/setup.php doctor | tail -n 25
          # The sample stores.json carries example seller data (Woodle, invalid IBANs): doctor must fail exactly those checks.
          $compose exec -T php php cli/setup.php doctor --json | php -r '$d = json_decode(stream_get_contents(STDIN), true); $f = array_column(array_filter($d["checks"], fn($c) => $c["status"] === "fail"), "name"); echo implode(",", $f), "\n"; $other = array_filter($f, fn($n) => !str_starts_with($n, "stores.legal.")); exit($other === [] && in_array("stores.legal.default", $f, true) ? 0 : 1);'

      - name: Docker logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color | tail -n 200

  browser-qualification:
    name: Browser, axe & Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, json, dom, libxml, sodium, gd
          coverage: none
          tools: none

      - name: Setup Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install qualification tools and browsers (Chromium, WebKit, Firefox)
        timeout-minutes: 40
        run: |
          npm ci
          # The runner's apt mirror can stall for minutes per package: time out and retry instead of hanging the job.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          for attempt in 1 2 3; do
            timeout 480 npx playwright install --with-deps chromium webkit firefox && exit 0
            echo "::warning::playwright install attempt $attempt did not finish; retrying"
            # timeout stops npx, not the apt-get it started: let that finish (it holds the dpkg lock) before retrying.
            timeout 600 bash -c 'while pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null; do sleep 10; done' || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: ESLint (storefront scripts and qualification tooling)
        run: npx eslint --max-warnings=0 .

      - name: Prepare disposable SQLite application
        env:
          E2E_RUNTIME_DIR: /tmp/barebones-e2e-sqlite
          E2E_STATE_PATH: /tmp/barebones-e2e-state.json
          BBE_ADMIN_IDENTITY_KEY: RUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUU=
        run: |
          php tests/e2e/prepare.php
          php cli/migrate.php
          php cli/seed.php --count=30
          php tests/e2e/seed.php

      - name: Playwright commerce and WCAG 2.2 AA qualification
        env:
          CI: '1'
          E2E_STATE_PATH: /tmp/barebones-e2e-state.json
          BBE_ADMIN_IDENTITY_KEY: RUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUU=
        run: npm run test:e2e

      - name: Lighthouse rendered-page budgets
        run: npm run test:lighthouse

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: browser-qualification-evidence
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

  database-qualification:
    name: Application & updater (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported LTS lines (MySQL 8.0 reached end of life in April 2026). Dependabot does not read service images:
          # refresh these digests (and redis above) by hand, e.g. `docker buildx imagetools inspect mysql:8.4`.
          - name: mysql:8.4
            database: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
            health_command: mysqladmin ping -h 127.0.0.1 -pupdate-root --silent
          - name: mariadb:11.4
            database: mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
            health_command: healthcheck.sh --connect --innodb_initialized

    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: update-root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: barebones_e2e_test
          MARIADB_ROOT_PASSWORD: update-root
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: barebones_e2e_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health_command }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, json, dom, libxml, sodium, gd
          coverage: none
          tools: none

      - name: Install MySQL/MariaDB client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      # Root only provisions; the shop and every test connect as bbe_ci, which owns nothing but the
      # disposable bbe_* / barebones_* databases (the same shape as a production shop user).
      # MySQL 8 has binary logging on, where a non-SUPER user may create triggers only with
      # log_bin_trust_function_creators enabled.
      - name: Provision least-privilege database user
        env:
          MYSQL_PWD: update-root
        run: |
          mariadb -h 127.0.0.1 -uroot -e "
            CREATE USER 'bbe_ci'@'%' IDENTIFIED BY 'bbe-ci-password';
            GRANT ALL PRIVILEGES ON \`bbe\\_%\`.* TO 'bbe_ci'@'%';
            GRANT ALL PRIVILEGES ON \`barebones\\_%\`.* TO 'bbe_ci'@'%';
            SET GLOBAL log_bin_trust_function_creators = 1;
            CREATE DATABASE barebones_parity_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          MYSQL_PWD=bbe-ci-password mariadb -h 127.0.0.1 -ubbe_ci -e 'SHOW GRANTS'

      - name: Prepare disposable native database application
        env:
          E2E_DB_DRIVER: mysql
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_NAME: barebones_e2e_test
          E2E_DB_USER: bbe_ci
          E2E_DB_PASSWORD: bbe-ci-password
          E2E_RUNTIME_DIR: /tmp/barebones-e2e-database
          E2E_STATE_PATH: /tmp/barebones-e2e-db-state.json
          BBE_ADMIN_IDENTITY_KEY: RUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUU=
        run: |
          php tests/e2e/prepare.php
          php cli/migrate.php
          php cli/seed.php --count=30
          php tests/e2e/seed.php

      - name: Run native application HTTP, parity, and updater qualification
        env:
          BAREBONES_REQUIRE_UPDATE_SIGNATURE_TEST: '1'
          BAREBONES_REQUIRE_MYSQL_UPDATE_TEST: '1'
          SMOKE_URL: http://127.0.0.1:8080
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=barebones_parity_test;charset=utf8mb4
          TEST_MYSQL_USER: bbe_ci
          TEST_MYSQL_PASS: bbe-ci-password
          TEST_MYSQL_UPDATE_DATABASE: barebones_update_test
          TEST_MYSQL_UPDATE_HOST: 127.0.0.1
          TEST_MYSQL_UPDATE_PORT: '3306'
          TEST_MYSQL_UPDATE_USER: bbe_ci
          TEST_MYSQL_UPDATE_PASS: bbe-ci-password
          TEST_MYSQL_DUMP_BINARY: mariadb-dump
          TEST_MYSQL_CLIENT_BINARY: mariadb
          BBE_ADMIN_IDENTITY_KEY: RUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUU=
        run: |
          # router.php applies the .htaccess deny/rewrite rules; bare `php -S -t .` would serve private files.
          php -S 127.0.0.1:8080 router.php >/tmp/barebones-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/barebones-http.log; exit 1; fi
            sleep 1
          done
          php cli/test.php
