name: CI

on:
  push:
    branches: [main, master, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring, json, dom, libxml, sodium
          coverage: none
          tools: none

      - name: PHP syntax check (php -l) on all sources
        run: |
          set -e
          find src cli migrations tests . -maxdepth 4 -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Prepare runtime directories
        run: |
          mkdir -p db cache logs jobs
          cp config.example.php config.php

      - name: Run test suite
        env:
          BAREBONES_REQUIRE_UPDATE_SIGNATURE_TEST: '1'
        run: php cli/test.php

      - name: Static analysis, i18n, WCAG 2.2 AA, and performance source gates
        run: |
          php cli/static-analysis.php
          php cli/i18n-parity.php
          php cli/quality-gates.php

  phpstan:
    name: PHPStan level 5 (baseline)
    runs-on: ubuntu-latest
    env:
      PHPSTAN_VERSION: '2.3.1'
      PHPSTAN_SHA256: 85157dba3d95d77ca603d2b7303aa78a538f9e3b56ccad07dd794c53aa96d1ae

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, json, dom, libxml, sodium
          coverage: none
          tools: none

      - name: Download pinned PHPStan phar (CI only, the runtime stays dependency-free)
        run: |
          curl -fsSL -o /tmp/phpstan.phar "https://github.com/phpstan/phpstan/releases/download/${PHPSTAN_VERSION}/phpstan.phar"
          echo "${PHPSTAN_SHA256}  /tmp/phpstan.phar" | sha256sum -c -

      - name: Analyse (new findings fail; existing ones are in phpstan-baseline.neon)
        run: php -d memory_limit=2G /tmp/phpstan.phar analyse -c phpstan.neon.dist --no-progress

  browser-qualification:
    name: Browser, axe & Lighthouse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, json, dom, libxml, sodium
          coverage: none
          tools: none

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install qualification tools and browsers (Chromium, WebKit, Firefox)
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit firefox

      - name: Prepare disposable SQLite application
        env:
          E2E_RUNTIME_DIR: /tmp/barebones-e2e-sqlite
          E2E_STATE_PATH: /tmp/barebones-e2e-state.json
          BBE_ADMIN_IDENTITY_KEY: RUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUU=
        run: |
          php tests/e2e/prepare.php
          php cli/migrate.php
          php cli/seed.php --count=30
          php tests/e2e/seed.php

      - name: Playwright commerce and WCAG 2.2 AA qualification
        env:
          CI: '1'
          E2E_STATE_PATH: /tmp/barebones-e2e-state.json
          BBE_ADMIN_IDENTITY_KEY: RUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUU=
        run: npm run test:e2e

      - name: Lighthouse rendered-page budgets
        run: npm run test:lighthouse

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-qualification-evidence
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

  database-qualification:
    name: Application & updater (${{ matrix.database }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql:8.0
            health_command: mysqladmin ping -h 127.0.0.1 -pupdate-root --silent
          - database: mariadb:11.4
            health_command: healthcheck.sh --connect --innodb_initialized

    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: update-root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: barebones_e2e_test
          MARIADB_ROOT_PASSWORD: update-root
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: barebones_e2e_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health_command }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, json, dom, libxml, sodium
          coverage: none
          tools: none

      - name: Install MySQL/MariaDB client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Prepare disposable native database application
        env:
          E2E_DB_DRIVER: mysql
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_NAME: barebones_e2e_test
          E2E_DB_USER: root
          E2E_DB_PASSWORD: update-root
          E2E_RUNTIME_DIR: /tmp/barebones-e2e-database
          E2E_STATE_PATH: /tmp/barebones-e2e-db-state.json
          BBE_ADMIN_IDENTITY_KEY: RUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUU=
        run: |
          mariadb -h 127.0.0.1 -uroot -pupdate-root -e 'CREATE DATABASE barebones_parity_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          php tests/e2e/prepare.php
          php cli/migrate.php
          php cli/seed.php --count=30
          php tests/e2e/seed.php

      - name: Run native application HTTP, parity, and updater qualification
        env:
          BAREBONES_REQUIRE_UPDATE_SIGNATURE_TEST: '1'
          BAREBONES_REQUIRE_MYSQL_UPDATE_TEST: '1'
          SMOKE_URL: http://127.0.0.1:8080
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=barebones_parity_test;charset=utf8mb4
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASS: update-root
          TEST_MYSQL_UPDATE_DATABASE: barebones_update_test
          TEST_MYSQL_UPDATE_HOST: 127.0.0.1
          TEST_MYSQL_UPDATE_PORT: '3306'
          TEST_MYSQL_UPDATE_USER: root
          TEST_MYSQL_UPDATE_PASS: update-root
          TEST_MYSQL_DUMP_BINARY: mariadb-dump
          TEST_MYSQL_CLIENT_BINARY: mariadb
          BBE_ADMIN_IDENTITY_KEY: RUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUU=
        run: |
          php -S 127.0.0.1:8080 -t . >/tmp/barebones-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/barebones-http.log; exit 1; fi
            sleep 1
          done
          php cli/test.php
