<!doctype html>
<html lang="en"><body style="font-family:Arial,sans-serif;color:#111">
<h2>Pay for your order</h2>
<p>Hello {{customer_name}},</p>
<p>order <strong>{{order_number}}</strong> ({{order_total}}) is waiting for payment. You can pay it with this link:</p>
<p><a href="{{pay_url}}" style="background:#4299e1;color:#fff;padding:10px 18px;text-decoration:none;border-radius:4px">Pay now</a></p>
<p style="color:#666;font-size:13px">Or copy this link: {{pay_url}}</p>
<p>The link is valid for {{valid_days}} days. If you have already paid, you can ignore this e-mail.</p>
</body></html>
