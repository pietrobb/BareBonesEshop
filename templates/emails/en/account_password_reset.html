<!doctype html>
<html lang="en"><body style="font-family:Arial,sans-serif;color:#111">
<h2>Password reset</h2>
<p>Hello {{customer_name}},</p>
<p>We received a request to reset the password for your account.</p>
<p><a href="{{reset_url}}" style="background:#4299e1;color:#fff;padding:10px 18px;text-decoration:none;border-radius:4px">Reset password</a></p>
<p style="color:#666;font-size:13px">Or copy this link: {{reset_url}}</p>
<p>This link expires in {{expires_in}} hour(s). If you did not request this, you can safely ignore this email.</p>
</body></html>
