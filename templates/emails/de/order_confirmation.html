<!doctype html>
<html lang="de"><body style="font-family:Arial,sans-serif;color:#111">
<h2>Vielen Dank für Ihre Bestellung, {{customer_name}}!</h2>
<p>Ihre Bestellung <strong>{{order_number}}</strong> wurde empfangen, Status: <strong>{{order_status}}</strong>.</p>
<h3>Artikel</h3>
<table style="border-collapse:collapse;width:100%">
<tr style="background:#f5f5f5"><th align="left">Produkt</th><th align="right">Menge</th><th align="right">Preis</th></tr>
{{#each items}}
<tr><td>{{name}} <small>({{sku}})</small></td><td align="right">{{quantity}}</td><td align="right">{{total}}</td></tr>
{{/each}}
</table>
<p><strong>Gesamt: {{order_total}}</strong></p>
</body></html>
