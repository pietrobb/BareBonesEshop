<div id="cc-banner" role="dialog" aria-labelledby="cc-title" aria-describedby="cc-body">
  <h3 id="cc-title">{{cookie_title}}</h3>
  <p id="cc-body">{{cookie_body}} <a href="{{privacy_url}}" class="cc-link">{{cookie_policy_link}}</a></p>
  <div id="cc-prefs">
    <label><input type="checkbox" checked disabled> {{cookie_necessary}}</label>
    <label><input type="checkbox" id="cc-ana"> {{cookie_analytics}}</label>
    <label><input type="checkbox" id="cc-mkt"> {{cookie_marketing}}</label>
  </div>
  <div class="cc-btns">
    <button type="button" class="cc-link" id="cc-prefs-toggle">{{cookie_preferences}}</button>
    <button type="button" class="danger" id="cc-reject">{{cookie_reject}}</button>
    <button type="button" class="primary" id="cc-accept">{{cookie_accept}}</button>
    <button type="button" class="primary" id="cc-save" hidden>{{cookie_save}}</button>
  </div>
</div>
