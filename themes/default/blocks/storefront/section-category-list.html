<section id="{{id}}" class="section section--categories section--{{settings.variant}}">
  <h2 class="section-title">{{#if content.heading}}{{content.heading}}{{else}}{{t.categories}}{{/if}}</h2>
  {{#if content.body_html}}<div>{{{content.body_html}}}</div>{{/if}}
  <div class="grid grid-3">
    {{#each data.items}}<a href="{{url}}" class="cat-card"><span>{{name}}</span><span class="count">{{count}}</span></a>{{/each}}
  </div>
</section>
