<div class="checkout-pending" data-account-claim><h1>{{heading}}</h1><p>{{message}}</p>{{#if error}}<p class="flash flash-error" role="alert">{{error}}</p>{{/if}}
<form method="post" action="{{action}}"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><input type="hidden" name="token" value="{{token}}"><label for="account-claim-password">{{password_label}}</label> <input id="account-claim-password" type="password" name="password" autocomplete="new-password" minlength="{{min_length}}" required> <button class="btn-checkout" type="submit">{{submit_label}}</button></form></div>
