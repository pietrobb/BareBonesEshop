<!doctype html>
<html lang="{{locale}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{title}}</title>
    {{#each assets.css}}<link rel="stylesheet" href="{{this}}">{{/each}}
    {{{seo_head}}}
</head>
<body>
{{#if body_html}}
{{{body_html}}}
{{else}}
<a class="skip-link" href="#main-content">{{t.skip_to_content}}</a>
{{> global/header}}
<main id="main-content" class="container" tabindex="-1">
    {{{content}}}
</main>
{{> global/footer}}
{{/if}}
{{{body_end}}}
{{#each assets.js}}<script src="{{this}}" defer></script>{{/each}}
{{{marketing_hooks}}}
</body>
</html>
